server {
    listen 80;
    server_name _;

    root /app/public;

    # Taille max des uploads (photos) — cf. issues #14/#15
    client_max_body_size 16m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Toutes les requêtes non statiques passent par le front controller Symfony
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_read_timeout 60s;

        # Empêche l'appel direct d'un autre .php via PATH_INFO
        internal;
    }

    # Aucun autre fichier PHP ne doit être exécuté directement
    location ~ \.php$ {
        return 404;
    }

    error_log  /var/log/nginx/llstudio_error.log;
    access_log /var/log/nginx/llstudio_access.log;
}
