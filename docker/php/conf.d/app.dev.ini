; Développement : on privilégie le rechargement immédiat du code
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Couverture de code : pcov est présent mais inactif, pour ne rien coûter à
; PHP-FPM. On l'active le temps d'une mesure avec -d pcov.enabled=1.
pcov.enabled = 0
pcov.directory = /app/src
