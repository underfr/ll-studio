gesdinet_jwt_refresh_token:
    refresh_token_class: App\Entity\RefreshToken

    # Le jeton d'accès JWT est volontairement court (1 h, cf. lexik) ; le
    # jeton de rafraîchissement, lui, garde la session ouverte 30 jours.
    ttl: 2592000

    # Chaque rafraîchissement consomme le jeton et en émet un nouveau : un
    # jeton volé ne peut donc servir qu'une fois, et sa réutilisation est
    # détectable.
    single_use: true

    # Le nouveau jeton repart pour 30 jours tant que l'utilisateur revient.
    single_use_ttl_update: true

    # La base ne stocke que l'empreinte du jeton : une copie du dump ne
    # permet pas de rafraîchir une session.
    hash_tokens:
        enabled: true

    # Une session par appareil, cinq appareils au maximum.
    max_tokens_per_user: 5

    # Le jeton de rafraîchissement voyage dans un cookie et non dans le corps
    # des réponses (issue #62). HttpOnly : aucun script de la page ne peut le
    # lire, donc une faille XSS ne permet pas de l'emporter. SameSite=Strict :
    # le navigateur ne l'envoie jamais depuis un autre site. Le chemin le
    # limite à /api/token/refresh et /api/token/invalidate, les seules routes
    # qui en ont l'usage : il ne part avec aucune autre requête.
    cookie:
        enabled: true
        same_site: strict
        path: /api/token
        http_only: true
        secure: true
        remove_token_from_body: true

    # Ajoute POST /api/token/refresh à la spécification OpenAPI générée par
    # API Platform, aux côtés de /api/login documenté par Lexik.
    api_platform:
        enabled: true

# Le développement et les tests tournent en HTTP. Un cookie Secure n'y serait
# pas renvoyé par tous les navigateurs, ni par le client HTTP des tests
# fonctionnels. La production garde Secure.
when@dev:
    gesdinet_jwt_refresh_token:
        cookie:
            secure: false

when@test:
    gesdinet_jwt_refresh_token:
        cookie:
            secure: false
